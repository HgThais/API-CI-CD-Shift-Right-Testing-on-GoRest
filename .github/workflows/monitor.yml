name: Shift-Right API Health & Latency Monitor

on:
  schedule:
    - cron: '0 * * * *'  # Tự động chạy mỗi giờ
  workflow_dispatch:     # Cho phép bấm nút "Run workflow" chạy tay

jobs:
  monitor-api-health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Execute API Performance & SLA Check
        run: |
          node -e '
          const https = require("https");
          const targetUrl = "https://gorest.co.in/public/v2/users";
          const SAMPLES = 3;
          const SLA_MS = 2000;
          let times = [];

          function checkOnce(cb) {
            const start = Date.now();
            https.get(targetUrl, (res) => {
              const elapsed = Date.now() - start;
              console.log(`[MONITOR] HTTP Status: ${res.statusCode} | Time: ${elapsed}ms`);
              if (res.statusCode !== 200) { process.exit(1); }
              cb(elapsed);
            }).on("error", (err) => {
              console.error(`[ERROR] ${err.message}`);
              process.exit(1);
            });
          }

          function run(i) {
            if (i >= SAMPLES) {
              const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
              console.log(`[MONITOR] Average Response Time (${SAMPLES} samples): ${avg}ms`);
              if (avg > SLA_MS) {
                console.error(`[ERROR] SLA Violated! SLA: ${SLA_MS}ms, Avg: ${avg}ms`);
                process.exit(1);
              }
              console.log("[SUCCESS] API Health Check Passed");
              return;
           }
           setTimeout(() => checkOnce((t) => { times.push(t); run(i + 1); }), 500);
          }

          run(0);
          '
