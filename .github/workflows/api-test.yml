name: Automated API Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman CLI
        run: npm install -g newman

      - name: Execute Postman Collection via Newman CLI
        run: |
          newman run 2474802017156_NguyenHoangThai_GoRest.postman_collection.json \
            -e 2474802017156_NguyenHoangThai_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}" \
            --reporters cli
